name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install
        run: npm ci

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npm run cap:prepare
          node scripts/patch-android-manifest.mjs

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/jaritok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jaritok-apk
          path: dist-apk/jaritok.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 자리톡 안드로이드
          body: |
            안드로이드 설치 파일입니다.

            1. 아래 `jaritok.apk`를 받습니다.
            2. 파일을 열어 설치합니다. (알 수 없는 앱 설치 허용)
            3. 자리톡을 실행한 뒤 열차를 조회하세요. 조회는 휴대폰에서 코레일로 바로 갑니다.
            4. 감시할 때는 앱을 켜 두세요.
          files: dist-apk/jaritok.apk
          make_latest: true
