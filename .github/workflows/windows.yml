name: Windows EXE from 99b2ea4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci

      - name: Build web into the app
        env:
          TAURI: "1"
        run: npm run build:desktop

      - name: Generate icons
        run: npx tauri icon public/__grok/icon-180.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: win-99b2ea4
          releaseName: 자리톡 윈도우 (99b2ea4)
          releaseBody: |
            Commit 99b2ea4 기준 윈도우 실행 파일입니다.
            조회는 이 컴퓨터에서 코레일로 바로 갑니다. 이전 desktop-latest 파일은 쓰지 마세요.

            1. 아래 설치 파일(`Jaritok_..._x64-setup.exe`)을 받습니다.
            2. 파일을 열어 설치합니다. Windows가 경고하면 "추가 정보" → "실행"을 누릅니다.
            3. 자리톡을 실행한 뒤 열차를 조회하세요.
            4. 감시할 때는 프로그램을 켜 두세요. VPN은 끄고 집 인터넷을 사용하세요.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
